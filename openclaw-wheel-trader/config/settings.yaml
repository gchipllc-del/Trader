# ============================================================
# RUNTIME SETTINGS — SECURITY CRITICAL
# ============================================================

# --- Mode ---
mode: paper              # paper | live — DO NOT CHANGE until Phase 1 criteria met
live_migration_approved: false   # Requires manual flip + documented approval

# --- Self-Audit Auto-Reconcile ---
# When self_audit detects STATE_DRIFT_BROKER (positions.json says open
# but broker shows 0 shares), auto-close the local record by matching
# against the broker's recent FILLED sell orders. Without this, the
# audit would just keep alerting every cycle while the drift persists.
#
# Safety: skips core_holdings (those need human attention), skips
# options (handled by wheel_state preflight), and uses the broker's
# real filled_avg_price for P&L. If no matching sell is found, closes
# the position flat with P&L=0 and a 'needs_review' audit flag.
auto_reconcile_phantoms: true

# --- Circuit Breakers ---
circuit_breakers:
  # Two layers — whichever is more restrictive wins:
  #   max_daily_loss      : hard dollar floor (kicks in regardless of equity)
  #   max_daily_loss_pct  : equity-relative ceiling (auto-scales as bankroll grows)
  # Today $1500 bankroll * -10% = -$150, which matches the dollar floor.
  # When equity grows the pct path tightens correctly; if equity drops below
  # $1500 the dollar floor still holds the line at -$150 absolute.
  max_daily_loss: -150
  max_daily_loss_pct: -0.10
  # Hard absolute ceiling enforced by check_position_size in run_all_checks.
  # Must be >= the highest per-asset cap (wheel_strategy.yaml stock_params /
  # crypto_params .max_position_pct). If you raise either of those, raise
  # this too — otherwise the breaker silently caps below the strategy.
  max_position_pct: 0.2         # 30% of portfolio per position (concentrated growth mode)
  auto_trim_buffer_pct: 0.02    # Auto-trim when position > max + buffer (so 32%) — prevents oversize drift
  max_sector_pct: 0.75          # 50% of portfolio per sector (allow conviction bets)
  max_open_orders: 8            # More concurrent orders for growth
  max_contracts_per_order: 2    # Start small
  cooldown_after_loss_minutes: 15  # Faster recovery (was 30)

  # Streak-based kill switch (NoFx pattern, github.com/NoFxAiOS/nofx).
  # After N consecutive losses, refuses new entries for the cooldown
  # window. Catches regime-mismatch days — bot fighting a trend it
  # doesn't understand — before they compound. Layered ON TOP of
  # cooldown_after_loss_minutes (single-loss recovery, above); this
  # is the rarer streak-detector. Set max_consecutive_losses to 0
  # to disable.
  max_consecutive_losses: 3
  streak_cooldown_hours: 24

# --- PDT Guard (Pattern Day Trader Rule) ---
pdt:
  enabled: true
  max_day_trades_5d: 3          # FINRA limit for accounts < $25k
  warning_at: 2                 # Warn when 2 day trades used

# --- Monitoring ---
monitoring:
  check_interval_seconds: 180   # 3 minutes (was 5) — faster reaction
  market_hours_only: true
  missed_check_alert: 3         # Alert after 3 missed checks
  missed_check_kill: 10         # Kill switch after 10 missed checks

# --- Hermes Optimization ---
hermes:
  enabled: true
  run_after_close: true         # Run optimization after market close
  lookback_days: 14             # Review last 2 weeks of trades
  min_trades_to_optimize: 3     # Need at least 3 trades before tuning

# --- Hermes Mode ---
# Controls whether Hermes auto-applies tuned params or just proposes them.
# "live" = apply automatically to wheel_strategy.yaml + this file.
# "shadow" = log proposals only; human approves manually.
hermes_mode: live

# --- Market-Regime Entry Filter (added 2026-05-23) ---
# Gates NEW positions when SPY downtrend OR VIX stressed; existing
# positions are still managed normally. Defaults to enabled.
# Toggle off with `enabled: false` if you want to bypass the gate
# temporarily without removing code.
regime_filter:
  enabled: true

# --- Rate Limiting ---
rate_limits:
  alpaca_calls_per_minute: 120
  backoff_base_seconds: 2
  backoff_max_seconds: 60

# --- Notifications ---
notifications:
  telegram_enabled: true
  alert_on:
    - order_filled
    - order_rejected
    - circuit_breaker_triggered
    - assignment_detected
    - kill_switch_activated
    - daily_summary
    - missed_monitoring_check
