# ============================================================
# RUNTIME SETTINGS — SECURITY CRITICAL
# ============================================================

# --- Mode ---
mode: paper              # paper | live — DO NOT CHANGE until Phase 1 criteria met
live_migration_approved: false   # Requires manual flip + documented approval

# --- Circuit Breakers ---
circuit_breakers:
  max_daily_loss: -300          # Dollars. Halt all trading if hit. (Aggressive: $300 on $1500)
  max_position_pct: 0.20        # 20% of portfolio per position (growth mode)
  max_sector_pct: 0.40          # 40% of portfolio per sector (growth mode)
  max_open_orders: 8            # More concurrent orders for growth
  max_contracts_per_order: 2    # Start small
  cooldown_after_loss_minutes: 15  # Faster recovery (was 30)

# --- PDT Guard (Pattern Day Trader Rule) ---
pdt:
  enabled: true
  max_day_trades_5d: 3          # FINRA limit for accounts < $25k
  warning_at: 2                 # Warn when 2 day trades used

# --- Monitoring ---
monitoring:
  check_interval_seconds: 180   # 3 minutes (was 5) — faster reaction
  market_hours_only: true
  missed_check_alert: 3         # Alert after 3 missed checks
  missed_check_kill: 10         # Kill switch after 10 missed checks

# --- Hermes Optimization ---
hermes:
  enabled: true
  run_after_close: true         # Run optimization after market close
  lookback_days: 14             # Review last 2 weeks of trades
  min_trades_to_optimize: 3     # Need at least 3 trades before tuning

# --- Rate Limiting ---
rate_limits:
  alpaca_calls_per_minute: 120
  backoff_base_seconds: 2
  backoff_max_seconds: 60

# --- Notifications ---
notifications:
  telegram_enabled: true
  alert_on:
    - order_filled
    - order_rejected
    - circuit_breaker_triggered
    - assignment_detected
    - kill_switch_activated
    - daily_summary
    - missed_monitoring_check
