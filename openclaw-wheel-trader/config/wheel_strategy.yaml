# --- Options-derived signals (lib/options_signals.py) -----------------
# Adds a ±2 boost to composite_score based on:
#   1. Per-ticker IV/HV ratio (options cheap/expensive vs realized)
#   2. SPY IV regime (low/normal/high — set per scan)
#   3. (Optional) Unusual call volume — extra API call per candidate, off by default
