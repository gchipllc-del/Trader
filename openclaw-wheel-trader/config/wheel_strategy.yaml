quant:
  min_sharpe: -0.5
  max_drawdown: -0.55
  min_quant_score: 3.5
  exclude_avoid: true
stock_params:
  # 2026-04-28: Investigated why bot is making 0 trades.
  # composite_score is sum(trend, level, signal, momentum) on a 0-13 scale
  # (NOT the 0-10 quant screener QScore). Today's actual composites for the
  # STRONG quant names are 1-4/13 because trend_score=0 across the board
  # (multi-timeframe alignment is weak in current chop regime).
  # Today's strongest names (BAC, F, SHOP) score composite=4. Setting
  # threshold to 4 so those clear the gate while AMD(1), VALE(1), PFE(1)
  # don't. The 3-pt floor still requires meaningful technical structure
  # (e.g. signal=3 candlestick pattern, OR momentum=3 + signal=1).
  # Was 10 (Hermes overshoot from 3-trade sample) → 7 (over-tight) → 4.
  min_composite_score: 4
  momentum_only_min_score: 2     # Was 3. Lowered so momentum-driven entries fire.
  stop_loss_pct: 0.035
  default_target_pct: 0.1
  trailing_stop_pct: 0.02
  # Per-asset Kelly cap for stock entries. settings.yaml
  # circuit_breakers.max_position_pct is the hard ceiling — keep this <= that.
  max_position_pct: 0.3
  # Floor on per-position sizing. With a small bankroll, Kelly often returns
  # 3-7% which produces $50-$100 positions and tiny dollar P&L per win.
  # Floor lifts those entries to a minimum stake so winning setups translate
  # into meaningful compounding. Effective range = [min_position_pct,
  # max_position_pct]. Edge case: if Kelly says "no trade" (shares == 0),
  # the floor does NOT override that — gate-out signals are still respected.
  min_position_pct: 0.10
  max_trades_per_scan: 3
  max_concurrent_positions: 5
  allow_momentum_only: true
  # Tiered trailing stop — tightens as unrealized P/L grows.
  # See lib/stock_engine.py:1093 for behavior. The static `trailing_stop_pct`
  # above (2%) is the fallback when this block is disabled.
  trailing_stop_tiered:
    enabled: true
    tighten_on_rsi_exhaustion: true   # 30% tighter when RSI ≥ 78
    tiers:
      - {min_pnl: 0.20, trail: 0.005}  # +20% → 0.5% trail (very tight, milk the runner)
      - {min_pnl: 0.12, trail: 0.008}  # +12% → 0.8% trail (aggressive lock)
      - {min_pnl: 0.07, trail: 0.012}  # +7%  → 1.2% trail (tighten — gains at risk)
      - {min_pnl: 0.03, trail: 0.018}  # +3%  → 1.8% trail (modest lock)
      - {min_pnl: 0.00, trail: 0.025}  # 0%   → 2.5% trail (breathing room early)
  support_distance_tiers:
  - 0.04
  - 0.07
  - 0.1
  enable_scale_out: true
  # Lowered 0.10 → 0.07 to cycle capital faster on a small bankroll.
  # At +7% the position takes half off, locking gains and freeing slot
  # capital for the next setup. The runner still benefits from tiered
  # trailing stops above. Trade-off: smaller per-trade max payout but
  # higher trade frequency and faster compounding back into Phase 2.
  partial_exit_threshold: 0.07
  partial_exit_fraction: 0.5
# ────────────────────────────────────────────────────────────────
# Core long-term holdings — algorithm BUYS them via the normal scan
# (they must still pass quant + technical + bull/bear gates), but
# once a position is opened, the exit logic skips it entirely.
# Used for high-conviction multi-year holds: no stop, no target,
# no trailing exit, no fund-manager rebalance trim. The only way
# to exit is manual intervention.
# Add tickers here AFTER you've decided. Empty by default — leaving
# this empty means the feature is dormant and behavior is unchanged.
core_holdings: []
tickers_crypto:
- BTC/USD
- ETH/USD
- SOL/USD
crypto_params:
  enabled: true
  # ─── Scalp mode (Tier B 2026-04-25) ───
  # Tighter, faster setup that cycles capital ~5-10x more than swing-mode.
  # The math: 0.2% spread + 0.1% slippage = 0.3% round-trip cost. A 3%
  # gross target = 2.7% net. Risk/reward 1.5:2.7 = 1:1.8. Need >55% win
  # rate to be net positive. The LLM ensemble + 10-feature score should
  # clear that bar IF calibration holds.
  min_trend_score: 7              # 7/10 — stricter than swing's 6 (less noise)
  min_rsi: 42                     # Slightly tighter than 40 (less false bottoms)
  max_rsi: 62                     # Avoid topping-out entries

  stop_loss_pct: 0.015            # 1.5% — was 7%. Tighter = more stop-outs but smaller losses
  target_pct: 0.03                # 3% — was 15%. Faster turnover
  trailing_stop_pct: 0.01         # 1% trailing once in profit
  partial_exit_threshold: 0.015   # Take half off at +1.5%
  partial_exit_fraction: 0.5

  max_position_pct: 0.20          # Same as before
  max_concurrent: 3               # Was 2. With faster turnover, 3 = ~3x activity
  max_trades_per_scan: 2          # Up from 1 — fill empty slots faster

  # Cost-edge gate: minimum NET edge after spread + slippage. Skip a
  # trade if (target_pct - spread_estimate - slippage_estimate) < this.
  # Crypto on Alpaca: ~0.2% spread, ~0.1% slippage typical = 0.3% costs.
  # 0.025 = 2.5% min net edge. Below this we're scalping into noise.
  min_net_edge: 0.025
  spread_estimate: 0.002
  slippage_estimate: 0.001

  # Volatility-adaptive overrides (Tier B force multiplier).
  # When ATR/price > volatility_high, widen targets+stops by 1.5x.
  # When ATR/price < volatility_low, tighten by 0.7x. Prevents the
  # bot from getting whipsawed in high-vol regimes or sitting bored
  # in low-vol regimes.
  atr_adaptive_enabled: true
  volatility_high: 0.04           # 4% ATR/price ratio
  volatility_low: 0.015           # 1.5%
  atr_high_multiplier: 1.5
  atr_low_multiplier: 0.7

  # Dynamic Kelly fraction based on conviction.
  # Base = 0.30, ramps up with composite_score and LLM probability.
  # High conviction (composite>=10 + llm_prob>=0.70) → 0.65 (near-half-Kelly).
  # Low conviction (composite<7 + llm_prob<0.55) → 0.20.
  kelly_fraction_base: 0.30
  kelly_fraction_high_conviction: 0.65
  kelly_fraction_low_conviction: 0.20
