  - PFE           # $27.00 — Q:9.0  S:1.00  -11% DD  (holding 5sh)
  - INTC          # $64.54 — Q:8.0  S:2.18  -24% DD  (1sh at $300 budget)
  - VALE          # $17.18 — Q:8.5  S:2.29  -20% DD  M:2/4  +93% 1Y!
  - WBD           # $27.41 — Q:8.5  S:2.73  -21% DD  +238% 1Y!
