stock_params:
  # 2026-05-26: Turtle pre-filter (lib/turtle_signal). When True, every
  # candidate must also clear:
  #   - long regime: today's close > 200-period SMA
  #   - donchian:    today's close > prior turtle_breakout_window-bar high
  #
  # 2026-05-28: loosened breakout window 40 → 20 (System-2 → System-1).
  # The 40-bar gate was rejecting ~10 candidates per scan, starving the
  # ~61% WR strategy (verified from 47-day real trade record). 20-bar
  # is the classic Dennis System-1 — more sensitive to shorter-term
  # breakouts. Regime filter (200-MA) still enforced — bot still won't
  # buy in downtrends, just catches breakouts earlier in uptrends.
  require_turtle_entry: true
  turtle_regime_window: 200
  turtle_breakout_window: 20
  min_composite_score: 4
  momentum_only_min_score: 2
  # 2026-05-27: REVERTED to original wider stops after live divergence
  # found. The tighter_stop variant was promoted on 2026-05-26 based on
  # a BACKTEST that ran with Turtle pre-filter active, but the Turtle
  # gate (`require_turtle_entry`) was never wired into the LIVE entry
  # path — only backtest. Result: live got tighter stops WITHOUT the
  # entry filter, so the same loose entries hit faster stop-outs. On
  # 2026-05-27 BAC stopped at -2.7% (would have ridden under old 3.5%
  # stop) and PLTR stopped at -3.8% (would have stopped earlier under
  # old stop too, slightly less harm). Reverting until require_turtle_entry
  # is enforced in stock_engine.py — then we can re-tighten safely.
  stop_loss_pct: 0.035
  # 2026-05-27 (PM): REVERTED the earlier 0.10 → 0.15 promotion after a
  # second look at the backtest. The "wider_target" variant won in v1
  # backtest only because the backtest always used current_price × (1 +
  # default_target_pct) as the profit target — but the LIVE engine
  # (lib/stock_engine.py:362) snaps target_price to the nearest
  # resistance zone whenever one is detected and only falls back to the
  # flat percentage when no zone exists. Once the backtest was updated
  # to mirror that snap (and also model partial exits + tiered trailing
  # like live does), wider_target produced byte-for-byte identical
  # trades to current. The +0.45pp avg_winner improvement was an
  # artifact of a flat-target world the live engine doesn't operate in.
  # See logs/backtest_2026-05-27_180d_v2.log for the validating run.
  # Same shape as the 2026-05-26 tighter_stop misfire — third in a
  # series of backtest-vs-live divergences caught before push.
  default_target_pct: 0.18
  trailing_stop_pct: 0.02

  # 2026-05-26: paper-to-live realism knobs (after the Kalshi paper-vs-live
  # divergence lesson). The backtest now models:
  #   - entry_slippage_pct: live BUY market orders fill at ASK (≈ +5 bps)
  #   - exit_slippage_pct:  live SELL market orders fill at BID  (≈ -5 bps)
  #   - gap_open_stops:     if overnight gap blew through a stop, fill
  #                         happens at the OPEN (not the idealized stop)
  # These cumulatively shave ~50-100 bps off the backtest's reported
  # return — a more honest projection of what live would actually do.
  entry_slippage_pct: 0.0005
  exit_slippage_pct: 0.0005
  gap_open_stops: true

  # 2026-05-26: Confluence filter (lib/confluence_filter). Require
  # multiple independent signals to agree before firing. Each
  # confirmer adds 3-7pp WR on average. Target: 65-72% WR.
  require_confluence: false
  confluence_min_agree: 3        # full-size if 3-of-3 evaluated agree
  confluence_half_size: 2        # half-size at 2-of-3
  # 2026-05-26: thresholds reverted after the tightening pass made WR
  # WORSE (50% → 49%). Lesson: Turtle + Markov + Bayesian all read
  # the same bars; tightening any of them doesn't add new information.
  # The 50% WR backtest ceiling is the real cost of bars-only signals.
  # To push WR > 50% we need event-driven (PEAD) + fundamentals
  # (Bull/Bear), which only run cleanly in LIVE mode, not backtest.
  bayesian_min_win_prob: 0.55
  markov_min_signal: 0.05
  pead_min_score: 0.15
  bull_bear_margin: 2
  enable_pead: false             # off for backtest (per-sim-date earnings
                                 # cache not built yet); ENABLE IN LIVE
  enable_markov: true
  enable_bull_bear: false        # off for backtest (live-only agents);
                                 # ENABLE IN LIVE for orthogonal vote
  # 2026-05-27: When bull_bear is ON, use the 5-round structured
  # debate (agents/debate.py) instead of one-shot score comparison.
  # Each side rebuts the other; facilitator synthesizes net action.
  # Pattern from hopit-ai/india-trade-cli (Vibe Trading), adapted to
  # our rule-based agents. Set to false to fall back to legacy raw-
  # score comparison gated by bull_bear_margin.
  enable_debate: false
  # 2026-05-27: Fundamentals Analyst — reads Finnhub balance-sheet
  # metrics (ROE, PE, D/E, current ratio, beta). Orthogonal to all
  # other confluence signals which read price/news. Defaults ON in
  # both live and backtest since the agent fails gracefully (returns
  # NEUTRAL = "no opinion") when no Finnhub key or no data.
  enable_fundamentals: false
  # 2026-05-27: Tiered conviction sizing — press harder when more of
  # the 6 confluence signals agree. Defaults below:
  #   3-4 agree → 1.0x  (full_confluence, base size)
  #   5 agree   → 1.5x  (strong_confluence)
  #   6 agree   → 1.75x (super_confluence; capped at conviction_size_cap)
  # All multipliers stack on Kelly's recommended size — they don't override
  # the upstream max_position_pct cap, so a 1.75x scale on a 0.10 Kelly
  # recommendation still clips at 0.30 portfolio max.
  enable_tiered_sizing: false
  confluence_strong_size: 5
  confluence_super_size: 6
  conviction_size_strong: 1.5
  conviction_size_super: 1.75
  conviction_size_cap: 1.75
  # 2026-05-27: Time-of-day filter — skip entries in the first/last
  # 30 min of trading (9:30-10:00 ET and 15:30-16:00 ET). Opening
  # and closing auction noise produces the most false breakouts.
  # Active window after filter: 10:00 ET — 15:30 ET.
  # LIVE ONLY (backtest bypasses since it runs at sim-date close).
  enable_time_of_day_filter: false
  # 2026-05-27: Volume confirmation — require today's bar volume to
  # be >= multiplier × N-day average. Filters Turtle breakouts on
  # dead tape (no demand behind the move → no follow-through). Set
  # multiplier 1.0 for "above average", 1.5 for "true volume thrust".
  # Applies in BOTH live and backtest.
  enable_volume_confirmation: false
  volume_confirmation_window: 20
  volume_confirmation_multiplier: 1.0
  # 2026-05-27: DIP-BUY mean-reversion sleeve (lib/dipbuy_signal). When
  # Turtle's breakout gate doesn't fire, try mean-reversion on the same
  # bar — buy oversold pullbacks WITHIN an uptrend (close > 200-MA AND
  # RSI ≤ rsi_threshold). The two are mutually exclusive (a bar can't
  # simultaneously break a 40-bar high AND be RSI<30), so no double-
  # counting risk. Dipbuy entries use ATR-based stops (wider than
  # Turtle's flat 3.5%) and 1.5× R:R targets, overriding the normal
  # zone-snap/percentage logic for that single trade.
  enable_dipbuy: true
  dipbuy_rsi_threshold: 30
  dipbuy_ma_touch_pct: 0.02
  max_position_pct: 0.225
  min_position_pct: 0.1
  max_trades_per_scan: 3
  max_concurrent_positions: 5
  allow_momentum_only: true
  trailing_stop_tiered:
    enabled: true
    tighten_on_rsi_exhaustion: true
    # 2026-05-27 (PM): REVERTED the 1.5× threshold scaling that
    # accompanied the default_target_pct 0.10 → 0.15 promotion — see
    # default_target_pct comment above for why the underlying promotion
    # was rolled back.
    tiers:
      - min_pnl: 0.2
        trail: 0.005
      - min_pnl: 0.12
        trail: 0.008
      - min_pnl: 0.07
        trail: 0.012
      - min_pnl: 0.03
        trail: 0.018
      - min_pnl: 0.0
        trail: 0.025
  support_distance_tiers:
    - 0.04
    - 0.07
    - 0.1
  enable_scale_out: true
  partial_exit_threshold: 0.07
  partial_exit_fraction: 0.5
