tickers_phase1:
- F
- BAC
- PFE
- INTC
- VALE
- WBD
- KO
- NIO
- RIVN
- NU
- SOFI
- CCL
- AAL
- CLF
- GRAB
- PLTR
- UBER
quant:
  min_sharpe: -0.5
  max_drawdown: -0.55
  min_quant_score: 3.5
  exclude_avoid: true
stock_params:
  min_composite_score: 8
  stop_loss_pct: 0.035
  default_target_pct: 0.1
  trailing_stop_pct: 0.03
  max_position_pct: 0.3
  max_trades_per_scan: 2
  max_concurrent_positions: 3
  allow_momentum_only: true
  momentum_only_min_score: 3
  support_distance_tiers:
  - 0.04
  - 0.07
  - 0.1
  enable_scale_out: true
  partial_exit_threshold: 0.15
  partial_exit_fraction: 0.5
tickers_phase2:
- F
- NIO
- SOFI
- AAL
- SNAP
tickers:
- AAPL
- MSFT
- NVDA
- AMD
- AMZN
- META
- GOOGL
- SPY
csp:
  delta_min: -0.35
  delta_max: -0.2
  dte_min: 30
  dte_max: 45
  min_annualized_return: 0.12
  min_open_interest: 100
  max_bid_ask_spread: 0.15
  strike_zone: support
cc:
  delta_min: 0.2
  delta_max: 0.35
  dte_min: 30
  dte_max: 45
  min_annualized_return: 0.1
  min_open_interest: 100
  max_bid_ask_spread: 0.15
  strike_zone: resistance
management:
  early_close_threshold: 0.8
  early_close_min_dte: 14
  roll_trigger_dte: 7
  roll_min_credit: 0.5
confirmation:
  min_composite_score: 7
  required_timeframes:
  - weekly
  - daily
  - 4hour
  bullish_patterns:
  - pin_bar
  - bullish_engulfing
  - morning_star
  - hammer
  - dragonfly_doji
  bearish_patterns:
  - shooting_star
  - bearish_engulfing
  - evening_star
  - gravestone_doji
zones:
  min_touches: 2
  zone_width_pct: 0.02
  lookback_days: 120
  room_to_left: true
iv:
  min_iv_rank: 30
  iv_rank_lookback: 252
kronos:
  enabled: true
  model_name: NeoQuasar/Kronos-base
  pred_bars: 10
  lookback: 200
  sample_count: 3
  temperature: 0.8
  cache_ttl_minutes: 60
  veto_return_threshold: -0.02
news_sentiment:
  enabled: true
  cache_ttl_minutes: 30
  veto_sentiment_threshold: 0.25
  min_confidence_to_veto: 0.3
bayesian:
  enabled: true
  min_win_prob: 0.58
  base_rate: 0.55
earnings_proximity:
  enabled: true
  hard_veto_days: 2
  soft_warn_days: 14
  soft_penalty: 0.5
correlation:
  enabled: true
  threshold: 0.7
  hard_veto: false
kelly:
  enabled: true
  fraction: 0.25
insider_flow:
  enabled: true
  lookback_days: 90
  min_confidence_to_boost: 0.3
congress_flow:
  enabled: true
  lookback_days: 180
  feed_staleness_warn_days: 60
  min_confidence_to_boost: 0.3
greeks:
  enabled: true
  risk_free_rate: 0.045
  default_iv: 0.3
  max_portfolio_vega: 500
  max_portfolio_abs_delta: 0.8
llm:
  enabled: true
  provider: deepseek
  model: deepseek-chat
  claude_model: claude-haiku-4-5
  max_tokens: 1000
  cache_ttl_minutes: 60
  trigger_composite_score: 8
  consensus_enabled: true
  consensus_veto_enabled: false
  consensus_veto_confidence: 0.7

  # Route analyze_option_setup / analyze_stock_setup through the `instructor`
  # library for pydantic-validated JSON output (auto-retries on bad JSON).
  # Falls back to the legacy regex parse if instructor isn't installed OR the
  # structured call itself fails.  Default on; set false to pin to legacy.
  use_instructor: true

  # Optional 2nd-phase orchestration via HuggingFace smolagents. When true,
  # approved candidates also get a unanimous 3-agent LLM vote before executing.
  # Off by default — requires `pip install smolagents`. See agents/consensus_smol.py.
  smol_consensus_enabled: false

# Document RAG (SEC filings, earnings transcripts, Congress/insider filings)
# via HKUDS/RAG-Anything. Feature-flagged skeleton — see lib/rag_corpus.py.
# Install deps: pip install raganything
rag:
  enabled: false
  model: deepseek-chat
  # Where parsed documents are cached on disk:
  working_dir: data/rag_corpus/lightrag_storage
