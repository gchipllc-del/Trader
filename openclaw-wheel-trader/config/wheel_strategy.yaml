crypto_params:
  # DECOMMISSIONED 2026-05-29: Alpaca crypto sleeve cut, launchd jobs removed.
  enabled: false
  min_trend_score: 7
  min_rsi: 42
  max_rsi: 62
  # 2026-05-28: crypto dip-buy mean-reversion fallback. When the
  # breakout/momentum filter above doesn't fire AND the asset is
  # oversold (RSI < dipbuy_rsi_threshold) within a long regime
  # (close > 200-bar SMA), take the mean-reversion entry instead.
  # Today's crypto is BTC/ETH/SOL at RSI 19-25 — textbook dip-buy
  # conditions that the standard filter rejects. Mirrors the
  # lib/dipbuy_signal sleeve used for stocks. Mutually exclusive
  # with the breakout entry (a bar can't be both above min_rsi 42
  # AND below dipbuy_rsi_threshold 30).
  enable_dipbuy: true
  dipbuy_rsi_threshold: 30
  # Crypto fetches 120 daily bars (see get_crypto_bars in lib.alpaca_client);
  # a 200-bar regime check is impossible. Use 100 instead — for crypto, a
  # 100-day SMA is still the "intermediate trend" signal we want.
  dipbuy_regime_window: 100
  stop_loss_pct: 0.015
  target_pct: 0.03
  trailing_stop_pct: 0.01
  partial_exit_threshold: 0.015
  partial_exit_fraction: 0.5
  max_position_pct: 0.2
  max_concurrent: 3
  max_trades_per_scan: 2
  min_net_edge: 0.025
  spread_estimate: 0.002
  slippage_estimate: 0.001
  atr_adaptive_enabled: true
  volatility_high: 0.04
  volatility_low: 0.015
  atr_high_multiplier: 1.5
  atr_low_multiplier: 0.7
  kelly_fraction_base: 0.3
  kelly_fraction_high_conviction: 0.65
  kelly_fraction_low_conviction: 0.2
